<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F4F0E7"/>
  <g id="page-title" data-pptx-bounds="52 20 1176 94" font-family="SimSun" fill="#1D1C19" font-weight="700">
    <text x="60" y="42" font-family="Microsoft YaHei" font-size="14" letter-spacing="2" fill="#C14E2C">系统与 App 助手</text>
    <text x="60" y="82" font-size="32">强在入口和上下文权限，弱在独立任务证据</text>
  </g>

  <g id="assistant-matrix" data-pptx-bounds="52 122 1176 520">
    <text x="60" y="148" font-size="15" fill="#4D4942">同样是“看见并回答”，系统权限和行动边界决定它们其实不是同一类产品。</text>
    <line x1="60" y1="170" x2="1220" y2="170" stroke="#B6AEA1" stroke-width="1"/>
    <text x="60" y="194" font-size="13" font-weight="700" fill="#6B6760">产品</text>
    <text x="240" y="194" font-size="13" font-weight="700" fill="#6B6760">输入 / 交互</text>
    <text x="500" y="194" font-size="13" font-weight="700" fill="#6B6760">上下文 / 行动</text>
    <text x="820" y="194" font-size="13" font-weight="700" fill="#6B6760">主要场景</text>
    <text x="1060" y="194" font-size="13" font-weight="700" fill="#6B6760">证据状态</text>

    <text x="60" y="228" font-family="SimSun" font-size="18" font-weight="700" fill="#1D1C19">Gemini Live</text>
    <text x="240" y="228" font-size="14" fill="#3F3B35">语音＋摄像头／屏幕</text>
    <text x="500" y="228" font-size="14" fill="#3F3B35">连续画面；2026 可主动纠正镜头</text>
    <text x="820" y="228" font-size="14" fill="#3F3B35">日常看、找物、读字</text>
    <text x="1060" y="228" font-size="13" fill="#1F5A49">上线；独立指标少</text>

    <text x="60" y="274" font-family="SimSun" font-size="18" font-weight="700" fill="#1D1C19">ChatGPT</text>
    <text x="240" y="274" font-size="14" fill="#3F3B35">语音＋图像／实时视频</text>
    <text x="500" y="274" font-size="14" fill="#3F3B35">通用多轮；依赖用户提供上下文</text>
    <text x="820" y="274" font-size="14" fill="#3F3B35">通用探索、学习</text>
    <text x="1060" y="274" font-size="13" fill="#C14E2C">功能强；任务证据少</text>

    <text x="60" y="320" font-family="SimSun" font-size="18" font-weight="700" fill="#1D1C19">小艺 / 看世界</text>
    <text x="240" y="320" font-size="14" fill="#3F3B35">语音＋实时视频＋指向</text>
    <text x="500" y="320" font-size="14" fill="#3F3B35">天气/日历/位置等系统服务</text>
    <text x="820" y="320" font-size="14" fill="#3F3B35">旅游、日常、无障碍</text>
    <text x="1060" y="320" font-size="13" fill="#C14E2C">来源冲突：静态 vs 实时</text>

    <text x="60" y="366" font-family="SimSun" font-size="18" font-weight="700" fill="#1D1C19">Apple Visual Intelligence</text>
    <text x="240" y="366" font-size="14" fill="#3F3B35">Camera Control 单次触发</text>
    <text x="500" y="366" font-size="14" fill="#3F3B35">地点、翻译、识物、搜索</text>
    <text x="820" y="366" font-size="14" fill="#3F3B35">快速识物、跨语言</text>
    <text x="1060" y="366" font-size="13" fill="#6B6760">工具化；持续协作少</text>

    <text x="60" y="412" font-family="SimSun" font-size="18" font-weight="700" fill="#1D1C19">Copilot Vision</text>
    <text x="240" y="412" font-size="14" fill="#3F3B35">语音＋桌面/手机画面</text>
    <text x="500" y="412" font-size="14" fill="#3F3B35">工作数据；高亮但不点击输入</text>
    <text x="820" y="412" font-size="14" fill="#3F3B35">知识工作、屏幕协作</text>
    <text x="1060" y="412" font-size="13" fill="#1F5A49">上下文强；执行未闭合</text>

    <text x="60" y="458" font-family="SimSun" font-size="18" font-weight="700" fill="#1D1C19">Muse</text>
    <text x="240" y="458" font-size="14" fill="#3F3B35">语音＋App/网页，后续眼镜</text>
    <text x="500" y="458" font-size="14" fill="#3F3B35">后台多步；支付/邮件需确认</text>
    <text x="820" y="458" font-size="14" fill="#3F3B35">购物、生产力、日历</text>
    <text x="1060" y="458" font-size="13" fill="#1F5A49">1000万设置；待独立验证</text>

    <text x="60" y="504" font-family="SimSun" font-size="18" font-weight="700" fill="#1D1C19">Bixby / 超级小爱</text>
    <text x="240" y="504" font-size="14" fill="#3F3B35">相机/文档/圈屏/设备入口</text>
    <text x="500" y="504" font-size="14" fill="#3F3B35">系统任务、陪伴与设备生态</text>
    <text x="820" y="504" font-size="14" fill="#3F3B35">手机与家庭</text>
    <text x="1060" y="504" font-size="13" fill="#A33B27">官方宣传 → 待实测</text>

    <text x="60" y="550" font-family="SimSun" font-size="18" font-weight="700" fill="#1D1C19">SeedRealtime</text>
    <text x="240" y="550" font-size="14" fill="#3F3B35">连续音视频全双工</text>
    <text x="500" y="550" font-size="14" fill="#3F3B35">边看边听边说；持续判断接话时机</text>
    <text x="820" y="550" font-size="14" fill="#3F3B35">陪伴、实时指导</text>
    <text x="1060" y="550" font-size="13" fill="#C14E2C">官方称量产；缺少独立测试</text>

    <line x1="60" y1="580" x2="1220" y2="580" stroke="#C9C1B4" stroke-width="1"/>
    <text x="60" y="612" font-family="SimSun" font-size="22" font-weight="700" fill="#1D1C19">分：平台助手正在商品化；差异化落在系统权限、失败恢复和可验证任务。</text>
  </g>

  <g id="page-footer" data-pptx-bounds="52 660 1176 18" fill="#7A756D" font-size="12">
    <text x="60" y="672">来源：全球竞品报告；产品层报告；各厂商官方与第三方评测</text>
    <text x="1220" y="672" text-anchor="end">10 / 21</text>
  </g>
</svg>
