<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei" data-pptx-page-role="content">
  <rect id="background" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F4F0E7"/>
  <g id="page-title" data-pptx-bounds="52 20 1176 94" font-family="SimSun" fill="#1D1C19" font-weight="700">
    <text x="60" y="42" font-family="Microsoft YaHei" font-size="14" letter-spacing="2" fill="#C14E2C">补页 05 · 云核心网机会</text>
    <text x="60" y="82" font-size="32">不要再做多模态 App，做它依赖的实时交互底座</text>
  </g>

  <g id="cloud-core-future" data-pptx-bounds="52 122 1176 520">
    <text x="60" y="148" font-size="15" fill="#4D4942">我们的优势不在再训练一个模型，而在连接、会话、时延、边缘、身份、权限和 SLA。</text>
    <rect x="60" y="172" width="260" height="116" fill="#1D1C19"/>
    <text x="78" y="202" font-size="15" font-weight="700" fill="#F4F0E7">实时媒体面</text>
    <text x="78" y="228" font-size="13" fill="#F4F0E7">音视频上行、抖动、丢包、</text>
    <text x="78" y="250" font-size="13" fill="#F4F0E7">多方混流、弱网切换</text>
    <text x="78" y="274" font-size="12" fill="#C9C1B4">卖点：可承诺的体验质量</text>

    <rect x="336" y="172" width="260" height="116" fill="#1F5A49"/>
    <text x="354" y="202" font-size="15" font-weight="700" fill="#F4F0E7">端边云协同</text>
    <text x="354" y="228" font-size="13" fill="#F4F0E7">端侧唤醒/脱敏/预筛；</text>
    <text x="354" y="250" font-size="13" fill="#F4F0E7">边缘低延迟；云端长记忆</text>
    <text x="354" y="274" font-size="12" fill="#E6EFEA">卖点：成本、隐私与时延平衡</text>

    <rect x="612" y="172" width="260" height="116" fill="#C14E2C"/>
    <text x="630" y="202" font-size="15" font-weight="700" fill="#F4F0E7">Agent 会话层</text>
    <text x="630" y="228" font-size="13" fill="#F4F0E7">连续会话、身份、权限、</text>
    <text x="630" y="250" font-size="13" fill="#F4F0E7">审计、转人工、跨域接管</text>
    <text x="630" y="274" font-size="12" fill="#F8E9E2">卖点：让任务可治理</text>

    <rect x="888" y="172" width="332" height="116" fill="#6B6760"/>
    <text x="906" y="202" font-size="15" font-weight="700" fill="#F4F0E7">Agent 互操作层</text>
    <text x="906" y="228" font-size="13" fill="#F4F0E7">个人 Agent ↔ 企业 Agent；身份、授权、</text>
    <text x="906" y="250" font-size="13" fill="#F4F0E7">交易、可信地址与网络路由</text>
    <text x="906" y="274" font-size="12" fill="#E8E4DD">卖点：从连接人升级为连接任务</text>

    <text x="60" y="330" font-size="14" font-weight="700" letter-spacing="2" fill="#C14E2C">可以做的三个产品方向</text>
    <text x="60" y="360" font-size="16" font-weight="700" fill="#1D1C19">1. 实时多模态 QoS</text>
    <text x="60" y="384" font-size="13" fill="#3F3B35">按任务保障带宽、时延、优先级；面向眼镜、车机、远程协助。</text>
    <text x="440" y="360" font-size="16" font-weight="700" fill="#1D1C19">2. Agent Session Fabric</text>
    <text x="440" y="384" font-size="13" fill="#3F3B35">统一连续会话、上下文状态、权限和跨设备切换。</text>
    <text x="850" y="360" font-size="16" font-weight="700" fill="#1D1C19">3. 可信 Agent 通道</text>
    <text x="850" y="384" font-size="13" fill="#3F3B35">身份、授权、审计、数据边界、人工接管和 SLA。</text>

    <line x1="60" y1="414" x2="1220" y2="414" stroke="#C9C1B4" stroke-width="1"/>
    <text x="60" y="448" font-size="14" font-weight="700" letter-spacing="2" fill="#1F5A49">建议路线</text>
    <text x="60" y="478" font-size="14" font-weight="700" fill="#1D1C19">0–30 天</text>
    <text x="150" y="478" font-size="14" fill="#3F3B35">拿 Muse / Gemini Live / SeedRealtime 做同一任务网络基线</text>
    <text x="60" y="508" font-size="14" font-weight="700" fill="#1D1C19">1–3 个月</text>
    <text x="170" y="508" font-size="14" fill="#3F3B35">做端边云分流、弱网降级、隐私脱敏和人工接管 PoC</text>
    <text x="60" y="538" font-size="14" font-weight="700" fill="#1D1C19">3–6 个月</text>
    <text x="170" y="538" font-size="14" fill="#3F3B35">选一个高价值任务做垂直闭环：无障碍、现场维护或车舱</text>
    <text x="60" y="568" font-size="14" font-weight="700" fill="#1D1C19">6–12 个月</text>
    <text x="180" y="568" font-size="14" fill="#3F3B35">沉淀 Agent session API、QoS 指标、审计与接管标准</text>
    <text x="60" y="612" font-family="SimSun" font-size="21" font-weight="700" fill="#C14E2C">分：核心网的机会是把多模态 Agent 从“能用”变成“可承诺、可治理、可规模化”。</text>
  </g>
  <g id="page-footer" data-pptx-bounds="52 660 1176 18" fill="#7A756D" font-size="12">
    <text x="60" y="672">补页 05 / 05 · 基于现有证据的产品方向推断，尚未经过真实客户验证</text>
    <text x="1220" y="672" text-anchor="end">EXT 05</text>
  </g>
</svg>
