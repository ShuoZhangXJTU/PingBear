    <line x1="440" y1="270" x2="440" y2="558" stroke="#D6CFC3" stroke-width="1" />
    <line x1="840" y1="270" x2="840" y2="558" stroke="#D6CFC3" stroke-width="1" />

    <text x="72" y="302" font-family="SimSun" font-size="34" font-weight="700" fill="#1D1C19">Gemini Live</text>
    <text x="72" y="334" font-size="16" font-weight="700" fill="#6B6760">Google · 2024 演示 / 2025 扩大上线</text>
    <text x="72" y="380" font-size="18" font-weight="700" fill="#C14E2C">输入</text>
    <text x="72" y="408" font-size="18" fill="#3F3B35">语音、摄像头、屏幕共享</text>
    <text x="72" y="448" font-size="18" font-weight="700" fill="#C14E2C">强项</text>
