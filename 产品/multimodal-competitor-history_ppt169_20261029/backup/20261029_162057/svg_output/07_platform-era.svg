    <text x="72" y="516" font-size="18" font-weight="700" fill="#C14E2C">边界</text>
    <text x="72" y="544" font-size="18" fill="#3F3B35">独立任务成功率未公开</text>

    <text x="472" y="302" font-family="SimSun" font-size="34" font-weight="700" fill="#1D1C19">Visual Intelligence</text>
    <text x="472" y="334" font-size="16" font-weight="700" fill="#6B6760">Apple · 2024.12</text>
    <text x="472" y="380" font-size="18" font-weight="700" fill="#1F5A49">输入</text>
