    <text x="472" y="544" font-size="18" fill="#3F3B35">更偏一次触发，持续协作较少</text>

    <text x="872" y="302" font-family="SimSun" font-size="34" font-weight="700" fill="#1D1C19">Copilot Vision</text>
    <text x="872" y="334" font-size="16" font-weight="700" fill="#6B6760">Microsoft · 2024.12 预览</text>
